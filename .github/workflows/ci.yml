name: ci

# Runs the smoke-test suite (protocol round-trip + schema, detection, planner
# routing for BOTH modalities, and intent switching) on every push/PR.
# The full experiment sweep (experiments/run_all.py) is not run in CI to keep
# the job short; reproduce it locally per the README.

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke tests
        env:
          MPLBACKEND: Agg      # headless: never open a display for matplotlib
        run: python -m tests.test_smoke
